<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jarvis Deck — Loop + Voice</title>
<style>
  body { background:#060809; color:#e8f0ee; font-family: system-ui, sans-serif; margin:0; }
  main { max-width: 760px; margin: 48px auto; padding: 0 20px; }
  #log { white-space: pre-wrap; border:1px solid #1d2a28; padding:12px; min-height:220px; }
  form { display:flex; gap:8px; margin-top:12px; }
  input { flex:1; padding:10px; background:#0b1110; color:#e8f0ee; border:1px solid #1d2a28; }
  button { padding:10px 16px; background:#c8f04a; border:0; font-weight:700; }
  button.mic { background:#14201e; color:#c8f04a; border:1px solid #c8f04a; }
  button.mic.live { background:#c8f04a; color:#060809; }
  #caption { min-height:22px; font-size:14px; opacity:.85; margin-top:8px; }
  #caption::before { content: "caption: "; opacity:.5; }
</style>
</head>
<body>
<main>
  <h1>Jarvis — Loop + Voice</h1>
  <div id="log"></div>
  <div id="caption"></div>
  <form id="f">
    <input id="q" placeholder="Type, or press Mic and speak" />
    <button type="submit">Send</button>
    <button type="button" class="mic" id="mic">Mic</button>
  </form>
</main>
<script>
  const log = document.getElementById("log");
  const cap = document.getElementById("caption");
  const f = document.getElementById("f");
  const q = document.getElementById("q");
  const mic = document.getElementById("mic");
  window.jarvis?.onStream(({ delta }) => { log.textContent += delta; });
  window.jarvis?.onDone(({ modelUsed, status }) => {
    log.textContent += `\n[${status} via ${modelUsed?.providerID}/${modelUsed?.id}]\n`;
  });
  // Live caption replaces itself as the engine revises — never appends.
  window.jarvis?.onCaption(({ text }) => { cap.textContent = text; });
  window.jarvis?.onCaptionFinal(({ text }) => {
    cap.textContent = text;
    log.textContent += "\n> (speech) " + text + "\n";
  });
  window.jarvis?.onAudioError(({ message }) => { cap.textContent = message; mic.classList.remove("live"); });
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = q.value.trim();
    if (!text) return;
    q.value = "";
    log.textContent += "\n> " + text + "\n";
    await window.jarvis.commitUtterance({ id: crypto.randomUUID(), text, source: "typed", engine: "typed", committedAt: Date.now() });
  });
  mic.addEventListener("click", async () => {
    if (mic.classList.contains("live")) { await window.jarvis.audioStop(); mic.classList.remove("live"); return; }
    mic.classList.add("live");
    cap.textContent = "listening…";
    const r = await window.jarvis.audioStart({});
    mic.classList.remove("live");
    if (!r?.ok) cap.textContent = r?.reason ?? "mic stopped";
  });
</script>
</body>
</html>
